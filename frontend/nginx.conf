server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # NEVER cache index.html or service worker files to ensure PWA updates instantly
    location ~* \.(?:manifest|appcache|html?|xml|json)$ {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control 'no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0';
    }

    location ~* (sw\.js|service-worker\.js|workbox-.*\.js)$ {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control 'no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0';
    }

    # Cache static assets deeply (since Vite hashes them in the filename)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|webp|svg|gif|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
